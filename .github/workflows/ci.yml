name: PhysFX CI

# GitHub 仅作为 Gitee 镜像后的质量验证平台。本工作流不执行推送、镜像或发布。

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: physfx-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: models
          key: physfx-models-${{ runner.os }}-${{ hashFiles('docs/model-lock.json') }}
      - name: 安装测试与格式工具
        run: python -m pip install pytest clang-format
      - name: 安装 CPU PyTorch（needs_models）
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: 下载并校验锁定模型（needs_models）
        run: python tools/download_models.py --lock
      - name: 安装 GUI 构建依赖
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
      - name: 校验提交与 DCO
        run: python tools/check_commit_msg.py --range ee6761e..HEAD
      - name: 扫描版权头
        run: python tools/check_copyright.py --root .
      - name: 检查 C++ 格式
        shell: bash
        run: git ls-files '*.h' '*.cpp' | xargs clang-format --dry-run --Werror
      - name: 默认构建并启用真实模型门禁（含可裁剪 GUI）
        run: cmake -S . -B build/off -DFETCHCONTENT_BASE_DIR="$PWD/third_party/cache/gui" -DPHYSFX_WITH_FFMPEG=OFF -DPHYSFX_WITH_ONNX=OFF -DPHYSFX_WITH_MODEL_TESTS=ON -DPHYSFX_BUILD_TESTS=ON -DPHYSFX_BUILD_GUI=ON
      - name: 编译
        run: cmake --build build/off --parallel 2
      - name: CTest
        run: ctest --test-dir build/off --output-on-failure
      - name: 运行 needs_models 真实权重验收
        run: ctest --test-dir build/off --output-on-failure -L needs_models
      - name: pytest
        run: PYTHONPATH="$PWD/bindings/python" python -m pytest -q tools/tests bindings/python/tests
      - name: 检查 Gitee 与 GitHub 镜像同步
        if: github.event_name == 'push'
        run: |
          git remote rename origin github
          git remote add origin https://gitee.com/xiang-weidian/phys-fx.git
          python tools/sync_check.py

  optional-switches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/cache@v5
        with:
          path: |
            third_party/cache/downloads
            third_party/ffmpeg
            third_party/onnxruntime
          key: physfx-deps-${{ runner.os }}-ffmpeg-8.1.2-onnx-1.18.1
      - name: 准备锁定的 LGPL FFmpeg 与 ONNX Runtime
        run: python tools/setup_deps.py --component all
      - name: 验证 FFmpeg 与 ONNX Runtime ON
        run: cmake -S . -B build/on -DPHYSFX_WITH_FFMPEG=ON -DPHYSFX_WITH_ONNX=ON -DPHYSFX_BUILD_TESTS=ON
      - name: 编译可选配置
        run: cmake --build build/on --parallel 2
      - name: 运行无模型测试
        run: LD_LIBRARY_PATH="$PWD/third_party/ffmpeg/lib:$PWD/third_party/onnxruntime/runtimes/linux-x64/native:$LD_LIBRARY_PATH" ctest --test-dir build/on --output-on-failure -LE needs_models
      - name: 保存演示视频
        uses: actions/upload-artifact@v4
        with:
          name: particle-occlusion-demo
          path: build/particle-occlusion-demo.mp4
          if-no-files-found: error
