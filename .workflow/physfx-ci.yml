version: "1.0"
name: physfx-ci
displayName: PhysFX 主流水线
triggers:
  push:
    branches: [master]
  pull_request:
    branches: [master]

stages:
  - name: quality
    displayName: 规范与零依赖验收
    jobs:
      - name: linux
        runs-on: linux
        steps:
          - checkout: self
            fetch-depth: 0
          - run: python3 -m pip install --user pytest clang-format
          - run: python3 tools/check_commit_msg.py --range ee6761e..HEAD
          - run: python3 tools/check_copyright.py --root .
          - run: git ls-files '*.h' '*.cpp' | xargs clang-format --dry-run --Werror
          - run: cmake -S . -B build/off -DPHYSFX_WITH_FFMPEG=OFF -DPHYSFX_WITH_ONNX=OFF -DPHYSFX_BUILD_TESTS=ON -DPHYSFX_BUILD_GUI=OFF
          - run: cmake --build build/off --parallel 2
          - run: ctest --test-dir build/off --output-on-failure
          - run: python3 -m pytest -q tools/tests bindings/python/tests
          - run: git remote get-url github || git remote add github https://github.com/weidian-xiang/phys-fx.git
          - run: python3 tools/sync_check.py

  - name: optional
    displayName: 可选依赖构建
    dependsOn: quality
    jobs:
      - name: switches
        runs-on: linux
        steps:
          - checkout: self
          - run: python3 tools/setup_deps.py --component all
          - run: cmake -S . -B build/on -DPHYSFX_WITH_FFMPEG=ON -DPHYSFX_WITH_ONNX=ON -DPHYSFX_BUILD_TESTS=ON
          - run: cmake --build build/on --parallel 2
          - run: LD_LIBRARY_PATH="$PWD/third_party/ffmpeg/lib:$PWD/third_party/onnxruntime/runtimes/linux-x64/native:$LD_LIBRARY_PATH" ctest --test-dir build/on --output-on-failure -LE needs_models
