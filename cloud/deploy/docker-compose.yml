services:
  api:
    image: python:3.11-slim
    working_dir: /app
    command: ["python", "-m", "cloud.server.app", "--host", "0.0.0.0", "--port", "8765"]
    ports:
      - "8765:8765"
    volumes:
      - ../..:/app:ro
      - physfx-cloud-data:/app/.physfx-cloud
    environment:
      PHYSFX_CLOUD_ROOT: /app/.physfx-cloud

volumes:
  physfx-cloud-data:
